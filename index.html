<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><meta name="theme-color" content="#0b0b0b"/><title>Song Note — Listen. Feel. Sing.</title><style>#globalAddMusic{position:fixed;top:20px;right:24px;z-index:45;display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:10px 17px;border:0;border-radius:999px;background:#d8ff66;color:#0b0b0b;font:700 14px/1.2 'DM Sans',sans-serif;cursor:pointer;box-shadow:0 8px 28px rgba(0,0,0,.28)}#globalAddMusic:hover{filter:brightness(1.05)}@media(max-width:700px){#globalAddMusic{top:74px;right:16px;min-height:38px;padding:9px 14px;font-size:13px}}</style></head><body><div id="root"></div><button id="globalAddMusic" type="button" aria-label="Add Music">＋ Add Music</button><script>document.getElementById('globalAddMusic').addEventListener('click',function(){var libraryButton=Array.from(document.querySelectorAll('button.nav,button.mobileNavItem')).find(function(button){return (button.textContent||'').trim()==='Library'});if(libraryButton)libraryButton.click();var tries=0;var timer=setInterval(function(){var addButton=document.querySelector('.sectionHead .primary');if(addButton){addButton.click();clearInterval(timer)}else if(++tries>30){clearInterval(timer)}},50)});</script><script type="module" src="/src/main.tsx"></script></body></html>
