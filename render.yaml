services:
  - type: web
    name: song-note-frontend
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: VITE_AUTH_API_URL
        value: https://song-note-auth-api.onrender.com

  - type: web
    name: song-note-auth-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: node auth-server.mjs
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: FRONTEND_ORIGIN
        value: https://song-note-frontend.onrender.com
      - key: STORAGE_DIR
        value: /var/data/song-note
      - key: DATABASE_URL
        fromDatabase:
          name: song-note-database
          property: connectionString

databases:
  - name: song-note-database
    plan: free
    region: singapore
    version: 18
